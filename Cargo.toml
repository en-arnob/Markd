[package]
name = "markd"
version = "1.0.3"
edition = "2021"
description = "A lightweight native Windows Markdown viewer"
license = "MIT"

# The package is also the workspace root; `xtask` is the build/packaging helper.
# `cargo build` here still builds only `markd` (default-members), while
# `cargo dist` runs the xtask that builds the release exe and the installer.
[workspace]
members = ["xtask"]
default-members = ["."]

[build-dependencies]
winresource = "0.1"

[dependencies]
pulldown-cmark = "0.12"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Controls_RichEdit",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
